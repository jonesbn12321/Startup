<!DOCTYPE html>
<html lang="en">
  <head>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <title>Monster Matching</title>

        <link id="favicon" rel="icon" />
         <script>
            const favicon = document.getElementById("favicon");
            if (favicon) {
                favicon.href = `https://robohash.org/${seed}?set=set2&size=64x64`;
            }

            // THIRD PARTY API CALL USING FETCH
            try {
                const response = await fetch(`https://robohash.org/${seed}?set=set2`);
                const imgUrl = response.url;

                const img = document.createElement("img");
                img.src = imgUrl;
                img.width = 120;

                document.body.appendChild(img);
            } catch (err) {
                console.error("Failed to load monster", err);
            }
        </script>

    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/index.jsx"></script>
    </body>
</html>
